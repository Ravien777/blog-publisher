<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Blog Publisher</title>
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="app-header">
          <div class="logo">
            <i class="fas fa-edit"></i>
            <h1>Blog Publisher</h1>
          </div>
          <div class="logo-subtitle">Editor for HDS</div>
        </div>

        <!-- placeholder for the site switcher (JS can be adjusted later) -->
        <div id="site-switcher-anchor"></div>

        <div class="post-config" id="sidebar-post-config">
          <div class="config-section">
            <h3>Post Details</h3>
            <div class="form-group">
              <label for="postTitle">Title</label>
              <input
                type="text"
                id="postTitle"
                placeholder="Enter post title..."
              />
            </div>
            <div class="form-group">
              <label for="postExcerpt">Excerpt (Meta)</label>
              <textarea
                id="postExcerpt"
                placeholder="SEO description..."
              ></textarea>
            </div>
          </div>

          <div class="config-section">
            <h3>Publishing</h3>
            <div class="form-group">
              <label for="postStatus">Status</label>
              <select id="postStatus">
                <option value="publish" selected>Publish</option>
                <option value="draft">Save as Draft</option>
                <option value="pending">Pending</option>
                <option value="private">Private</option>
              </select>
            </div>
            <div class="form-group">
              <label for="featuredImageUpload">Featured Image</label>
              <input type="file" id="featuredImageUpload" accept="image/*" />
            </div>
          </div>

          <div class="config-section">
            <h3>SEO & Publishing</h3>

            <div class="form-group">
              <label for="postKeyword">Focus Keyword</label>
              <input
                type="text"
                id="postKeyword"
                placeholder="Target keyword for SEO"
              />
              <small class="hint">Works with Yoast SEO & Rank Math</small>
            </div>

            <div class="form-group">
              <label for="postSlug">Slug (URL)</label>
              <input
                type="text"
                id="postSlug"
                placeholder="auto-generated-from-title"
              />
              <small class="hint"
                >Leave empty to auto-generate from title</small
              >
            </div>

            <div class="form-group">
              <label>Content Type</label>
              <input
                type="text"
                id="contentType"
                class="content-type-indicator"
                readonly
                title="Content type"
              />
            </div>
          </div>
        </div>

        <div class="sidebar-actions">
          <button
            id="saveBtn"
            class="icon-btn btn-primary"
            title="Publish to WordPress"
          >
            <i class="fab fa-wordpress"></i>
          </button>

          <button
            id="cancelEditBtn"
            class="icon-btn btn-warning"
            title="Cancel Edit"
            style="display: none"
          >
            <i class="fas fa-times"></i>
          </button>

          <button
            id="clearBtn"
            class="icon-btn btn-secondary"
            title="Clear Editor"
          >
            <i class="fas fa-broom"></i>
          </button>

          <button
            class="icon-btn btn-danger"
            onclick="window.close()"
            title="Close App"
          >
            <i class="fas fa-power-off"></i>
          </button>
        </div>
      </aside>

      <!-- Main Content (toolbar + views) -->
      <main class="main-content">
        <!-- Toolbar moved inside main-content -->
        <div class="toolbar">
          <button
            id="view-editor-btn"
            class="view-toggle-btn active"
            title="Editor Mode"
          >
            <i class="fas fa-pen-to-square"></i> Editor
          </button>
          <button
            id="view-library-btn"
            class="view-toggle-btn"
            title="Library Mode"
          >
            <i class="fas fa-folder-open"></i> Library
          </button>
          <div class="toolbar-divider"></div>
          <button id="heading-btn" title="Add Heading">
            <i class="fas fa-heading"></i>
          </button>
          <button id="image-btn" title="Add Image">
            <i class="fas fa-image"></i>
          </button>
          <button id="link-btn" title="Add Link">
            <i class="fas fa-link"></i>
          </button>
          <button id="list-btn" title="Add List">
            <i class="fas fa-list-ul"></i>
          </button>
          <button id="quote-btn" title="Add Quote">
            <i class="fas fa-quote-right"></i>
          </button>
        </div>

        <div id="editor-area" class="view-container editor-area">
          <div id="editorjs"></div>
        </div>
        <div
          id="library-view"
          class="view-container library-view"
          style="display: none"
        >
          <div class="library-header">
            <h2>Posts Library</h2>
            <div class="library-controls">
              <button class="type-toggle-btn active" data-type="post">
                Posts
              </button>
              <button class="type-toggle-btn" data-type="page">Pages</button>
              <select id="lib-status-filter" class="lib-filter">
                <option value="any">All Status</option>
                <option value="publish">Published</option>
                <option value="draft">Drafts</option>
                <option value="pending">Pending</option>
              </select>
              <input
                type="text"
                id="lib-search"
                class="lib-search"
                placeholder="Search..."
              />
              <button
                id="lib-create-new"
                class="btn-create-new"
                title="Create New"
              >
                <i class="fas fa-plus"></i> New
              </button>
              <button
                id="lib-refresh"
                class="btn-refresh"
                title="Refresh Cache"
              >
                <i class="fas fa-sync-alt"></i>
              </button>
            </div>
          </div>
          <div class="post-list-wrapper"></div>
          <div class="pagination-wrapper"></div>
        </div>
      </main>

      <!-- Status Bar (grid row 2, column 2) -->
      <div class="status-bar">
        <span id="status-text">✅ Online</span>
        <span id="network-status"></span>
      </div>
    </div>
    <script src="./dist/renderer.js"></script>
  </body>
</html>
